<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ud-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ud-tooth-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="ud-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#ud-bg-grad)" />

  <!-- Tooth Symbol with Drop Shadow & Gradient Fill -->
  <g filter="url(#ud-shadow)">
    <path
      d="M32 19
         C28.5 14.5 22 13 17 17
         C12 21 11 28 13 36
         C15 44 19.5 50.5 22.5 51
         C25 51.5 27 46 28 40
         C28.8 35.5 30.5 33 32 33
         C33.5 33 35.2 35.5 36 40
         C37 46 39 51.5 41.5 51
         C44.5 50.5 49 44 51 36
         C53 28 52 21 47 17
         C42 13 35.5 14.5 32 19 Z"
      fill="url(#ud-tooth-grad)"
    />

    <!-- Subtle Tooth Crown Highlights / Contours -->
    <path
      d="M20 18.5 C24 16 28.5 18 32 21 C35.5 18 40 16 44 18.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.5"
      stroke-linecap="round"
      opacity="0.6"
    />
  </g>
</svg>
